<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="64" height="64" fill="#000000"/>

  <!-- Crossbones -->
  <g fill="#d9d9d9">
    <!-- Top-left to bottom-right bone -->
    <rect x="10" y="12" width="8" height="8"/>
    <rect x="14" y="16" width="8" height="8"/>
    <rect x="18" y="20" width="8" height="8"/>
    <rect x="22" y="24" width="8" height="8"/>
    <rect x="26" y="28" width="8" height="8"/>
    <rect x="30" y="32" width="8" height="8"/>
    <rect x="34" y="36" width="8" height="8"/>
    <rect x="38" y="40" width="8" height="8"/>
    <rect x="42" y="44" width="8" height="8"/>

    <!-- Top-right to bottom-left bone -->
    <rect x="46" y="12" width="8" height="8"/>
    <rect x="42" y="16" width="8" height="8"/>
    <rect x="38" y="20" width="8" height="8"/>
    <rect x="34" y="24" width="8" height="8"/>
    <rect x="30" y="28" width="8" height="8"/>
    <rect x="26" y="32" width="8" height="8"/>
    <rect x="22" y="36" width="8" height="8"/>
    <rect x="18" y="40" width="8" height="8"/>
    <rect x="14" y="44" width="8" height="8"/>

    <!-- Bone ends -->
    <rect x="6" y="8" width="8" height="8"/>
    <rect x="14" y="8" width="8" height="8"/>
    <rect x="6" y="16" width="8" height="8"/>

    <rect x="42" y="8" width="8" height="8"/>
    <rect x="50" y="8" width="8" height="8"/>
    <rect x="50" y="16" width="8" height="8"/>

    <rect x="6" y="40" width="8" height="8"/>
    <rect x="6" y="48" width="8" height="8"/>
    <rect x="14" y="48" width="8" height="8"/>

    <rect x="42" y="48" width="8" height="8"/>
    <rect x="50" y="40" width="8" height="8"/>
    <rect x="50" y="48" width="8" height="8"/>
  </g>

  <!-- Skull -->
  <g fill="#d9d9d9">
    <!-- Skull shape -->
    <rect x="20" y="14" width="24" height="4"/>
    <rect x="16" y="18" width="32" height="4"/>
    <rect x="16" y="22" width="32" height="4"/>
    <rect x="14" y="26" width="36" height="4"/>
    <rect x="14" y="30" width="36" height="4"/>
    <rect x="16" y="34" width="32" height="4"/>
    <rect x="20" y="38" width="24" height="4"/>
    <rect x="24" y="42" width="16" height="4"/>

    <!-- Eyes -->
    <rect x="20" y="26" width="8" height="8" fill="#000000"/>
    <rect x="36" y="26" width="8" height="8" fill="#000000"/>

    <!-- Nose -->
    <rect x="30" y="34" width="4" height="4" fill="#000000"/>

    <!-- Teeth -->
    <rect x="24" y="42" width="2" height="6" fill="#000000"/>
    <rect x="30" y="42" width="2" height="6" fill="#000000"/>
    <rect x="36" y="42" width="2" height="6" fill="#000000"/>
  </g>
</svg>
